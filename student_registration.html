<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>
</head>
<body>

    <h1>Student Registration Form</h1>
    <p>Fill in your details to register.</p>

    <form>
        <label for="fullName">Full Name:</label><br>
        <input type="text" id="fullName" name="fullName" placeholder="Enter your full name" required>
        <br><br>

        <label for="email">Email Address:</label><br>
        <input type="email" id="email" name="email" placeholder="Enter your email" required>
        <br><br>

        <label for="phone">Phone Number:</label><br>
        <input type="tel" id="phone" name="phone" placeholder="Enter phone number">
        <br><br>

        <label for="dob">Date of Birth:</label><br>
        <input type="date" id="dob" name="dob">
        <br><br>

        <p>Gender:</p>
        <input type="radio" id="male" name="gender" value="Male">
        <label for="male">Male</label>
        <input type="radio" id="female" name="gender" value="Female">
        <label for="female">Female</label>
        <br><br>

        <label for="course">Select Course:</label><br>
        <select id="course" name="course">
            <option value="">Choose a course</option>
            <option>Software Engineering</option>
            <option>Data Science with AI</option>
            <option>Cyber Security</option>
            <option>Computer Packages</option>
        </select>
        <br><br>

        <label for="reason">Why do you want to join?</label><br>
        <textarea id="reason" name="reason" rows="5" cols="35"
            placeholder="Write something about yourself"></textarea>
        <br><br>

        <input type="checkbox" id="terms" name="terms" required>
        <label for="terms">I agree to the registration terms.</label>
        <br><br>

        <button type="submit">Register</button>
        <button type="reset">Clear Form</button>
    </form>

</body>
</html>
